<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | LingoX Royal Academy</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Admin Styling -->
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="login-page-body">

    <!-- Ambient Glow Background -->
    <div class="login-glow-bg"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <img src="assets/logo/bhasha-logo.jpeg" alt="LingoX"
                    style="width: 100%; height: 100%; border-radius: 12px; object-fit: cover;">
            </div>
            <h2>Admin Control Center</h2>
            <p>AI-Based Natural & Programming Language Proficiency System</p>
        </div>

        <!-- Quick Demo Credentials Fill -->
        <div class="demo-credentials-pill" id="btnFillDemo" title="Click to autofill administrator credentials">
            <span><i class="bi bi-shield-lock-fill me-1" style="color: #34d399;"></i> Demo Admin: <strong>admin@bhasha.ai</strong></span>
            <span class="badge"
                style="background: rgba(16, 185, 129, 0.25); color: #34d399; padding: 3px 8px; border-radius: 6px; font-weight: 600;">Autofill</span>
        </div>

        <form id="adminLoginForm">
            <div class="form-group-custom">
                <label class="form-label-custom" for="adminEmail">Administrator Email</label>
                <div style="position: relative;">
                    <i class="bi bi-envelope"
                        style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="email" id="adminEmail" class="form-control-custom" style="padding-left: 40px;"
                        placeholder="admin@bhasha.ai" required autocomplete="email">
                </div>
            </div>

            <div class="form-group-custom">
                <label class="form-label-custom" for="adminPassword">Master Password</label>
                <div style="position: relative;">
                    <i class="bi bi-key"
                        style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="password" id="adminPassword" class="form-control-custom"
                        style="padding-left: 40px; padding-right: 40px;" placeholder="••••••••" required
                        autocomplete="current-password">
                    <button type="button" id="togglePasswordBtn"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div
                style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; font-size: 0.82rem; color: var(--text-secondary);">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" id="rememberMe" checked style="accent-color: var(--primary);">
                    <span>Remember session</span>
                </label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <a href="login.html" style="color: #94a3b8; font-size: 0.82rem; text-decoration: none;">Learner Login</a>
                    <span style="color: rgba(255, 255, 255, 0.2);">|</span>
                    <a href="index.html" style="color: #34d399; font-size: 0.82rem; font-weight: 600; text-decoration: none;">Academy &rarr;</a>
                </div>
            </div>

            <button type="submit" class="btn-login-submit" id="btnLogin">
                <span id="loginBtnSpinner" style="display: none;" class="spinner-border spinner-border-sm me-2"></span>
                <i class="bi bi-box-arrow-in-right"></i>
                <span id="loginBtnText">Authenticate Access</span>
            </button>
        </form>

        <div
            style="margin-top: 26px; text-align: center; border-top: 1px solid var(--border-glass); padding-top: 18px;">
            <p style="font-size: 0.75rem; color: var(--text-muted);">
                <i class="bi bi-shield-check text-success me-1"></i> End-to-end encrypted admin authentication layer.
            </p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container-custom" id="toastContainer"></div>

    <!-- Scripts -->
    <script src="js/admin-api.js"></script>
    <script>
        // Check if already authenticated
        if (AdminAPI.isAuthenticated()) {
            const user = AdminAPI.getUser();
            if (user && user.role === 'admin') {
                window.location.href = 'admin.html';
            }
        }

        // Autofill demo button
        const btnFillDemo = document.getElementById('btnFillDemo');
        if (btnFillDemo) {
            btnFillDemo.addEventListener('click', () => {
                document.getElementById('adminEmail').value = 'admin@bhasha.ai';
                document.getElementById('adminPassword').value = 'admin123';
                showToast('Administrator credentials filled. Click Authenticate Access.', 'info');
            });
        }

        // Toggle password visibility
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passInput = document.getElementById('adminPassword');
        toggleBtn.addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            toggleBtn.innerHTML = isPass ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });

        // Login form submit
        const form = document.getElementById('adminLoginForm');
        const btnLogin = document.getElementById('btnLogin');
        const btnText = document.getElementById('loginBtnText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            btnLogin.disabled = true;
            btnText.textContent = 'Verifying credentials...';

            try {
                const res = await AdminAPI.login(email, password);
                showToast(`Welcome back, ${res.user.full_name}! Redirecting...`, 'success');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);
            } catch (err) {
                showToast(err.message || 'Authentication failed. Please verify credentials.', 'error');
                btnLogin.disabled = false;
                btnText.textContent = 'Authenticate Access';
            }
        });

        // Toast feedback helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-custom toast-${type}`;

            const iconMap = {
                success: '<i class="bi bi-check-circle-fill text-success fs-5"></i>',
                error: '<i class="bi bi-exclamation-triangle-fill text-danger fs-5"></i>',
                info: '<i class="bi bi-info-circle-fill text-primary fs-5"></i>'
            };

            toast.innerHTML = `
                ${iconMap[type] || iconMap.info}
                <div style="flex: 1;">${message}</div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>

</html>
